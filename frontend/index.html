<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fbfb" />
    <script>
      (function () {
        var tema = 'claro'
        try {
          if (localStorage.getItem('sg-tema') === 'oscuro') tema = 'oscuro'
        } catch (e) {}
        document.documentElement.dataset.tema = tema
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', tema === 'oscuro' ? '#1b2836' : '#f8fbfb')
      })()
    </script>
    <meta
      name="description"
      content="SafeGuard protege a las personas frente a enlaces y códigos QR, y entrena a los equipos con simulaciones de phishing reales de la región."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>SafeGuard — Protegé el clic. Enseñá en el momento.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
