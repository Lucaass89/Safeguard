<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SafeGuard" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      (function () {
        var tema = 'claro'
        try {
          var guardado = null
          try { guardado = localStorage.getItem('sg-tema') } catch (e) {}
          if (guardado === 'oscuro') tema = 'oscuro'
          if (guardado === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches) tema = 'oscuro'
        } catch (e) {}
        document.documentElement.dataset.tema = tema
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', tema === 'oscuro' ? '#1b2836' : '#ffffff')
      })()
    </script>
    <meta
      name="description"
      content="SafeGuard protege a las personas frente a enlaces y códigos QR, y entrena a los equipos con simulaciones de phishing reales de la región."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>SafeGuard — Protegé el clic. Enseñá en el momento.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
