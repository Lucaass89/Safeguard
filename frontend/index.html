    <script>
      (function () {
        var tema = 'oscuro'
        try {
          var guardado = null
          try { guardado = localStorage.getItem('sg-tema') } catch (e) {}
          if (guardado === 'claro') tema = 'claro'
          if (guardado === 'sistema' && !window.matchMedia('(prefers-color-scheme: dark)').matches) tema = 'claro'
        } catch (e) {}
        document.documentElement.dataset.tema = tema
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', tema === 'oscuro' ? '#070d1a' : '#e9dfcf')
      })()
    </script>
