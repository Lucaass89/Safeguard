name: SafeLink

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Evaluación del motor
        run: npm run eval
      - name: Reporte en el resumen
        if: always()
        run: cat eval/reporte.md >> "$GITHUB_STEP_SUMMARY"
      - run: npx vite build
