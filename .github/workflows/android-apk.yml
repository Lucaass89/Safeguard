name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Preparar la clave de publicación
        env:
          SG_FIRMA_BASE64: ${{ secrets.SG_FIRMA_BASE64 }}
        run: |
          if [ -z "$SG_FIRMA_BASE64" ]; then
            echo "Falta el secreto SG_FIRMA_BASE64: no se puede firmar el APK."
            exit 1
          fi
          echo "$SG_FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/safeguard.jks"
          echo "SG_FIRMA_ARCHIVO=$RUNNER_TEMP/safeguard.jks" >> "$GITHUB_ENV"
      - name: Compilar el APK firmado
        working-directory: android
        env:
          SG_FIRMA_CLAVE: ${{ secrets.SG_FIRMA_CLAVE }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash ./gradlew --no-daemon assembleRelease
      - name: Comprobar la firma
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: safeguard-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/safeguard.jks"
